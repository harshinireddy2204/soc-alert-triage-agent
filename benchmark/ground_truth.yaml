# Ground truth for the triage benchmark.
#
# Every case is one process on one host plus the detection rules that fired on it.
# A case gets one of three labels:
#
#   malicious    The process was controlled by the simulated attacker (a foothold, a
#                descendant of one, or a process the attacker started remotely), or
#                it is a system service carrying out the attacker's request and the
#                event that fired names something the attacker created (a task, a
#                service, a dropped file, a tampered setting).
#   benign       Unrelated to the simulated attack: the operating system, the cloud
#                and monitoring agents on the lab machines, ordinary user software.
#   side_effect  A Windows component reacting generically to something the attacker
#                started, where the event that fired contains nothing the attacker
#                made (for example csrss.exe opening a handle to a new process).
#                Reasonable analysts disagree on these, so they are reported but
#                left out of the headline scores.
#
# How a label is derived (see src/triage/labels.py), first match wins:
#   1. `decisions` under the capture: a reviewed call on one specific process.
#   2. Attacker lineage: the process matches a foothold or descends from one.
#   3. `recurring`: situations that repeat across captures, mostly routine activity
#      of the lab machines.
# A case that matches nothing fails the build, so nothing is labeled by default.
#
# Footholds come from each capture's published description of what the attacker
# ran (Security Datasets metadata, including the attacker console transcript).

foothold_signatures:
  - id: empire-stager
    image: '*\powershell.exe'
    cmdline: ['*-noP -sta -w 1 -enc*']
    why: PowerShell Empire agent, started with Empire's stager command line (-noP -sta -w 1 -enc)
  - id: covenant-grunt
    image: '*\GruntHTTP*.exe'
    why: Covenant implant binary (Grunt)
  - id: downloaded-payload
    image: '*\Downloads\payload.exe'
    why: Metasploit payload run from the user's Downloads folder, the entry point of this capture

recurring:
  - id: task-scheduler-service
    label: benign
    why: >-
      Task Scheduler service updating built-in Windows or vendor tasks. No attacker step in
      this capture creates or changes a scheduled task.
    match:
      image: '*\svchost.exe'
      rules_all: ['Scheduled Task Created - *', 'BITS Client BitsProxy DLL Loaded By Uncommon Process']
      triggers_all:
        - 'image loaded: C:\Windows\System32\BitsProxy.dll*'
        - '*\Schedule\TaskCache\Tasks\{*'
        - '*\Schedule\TaskCache\Tree\Microsoft*'
        - '*\System32\Tasks\Microsoft\Windows\*'
        - '*\System32\Tasks\OneDrive Standalone Update Task*'
        - '*\Schedule\TaskCache\Tree\OneDrive Standalone Update Task*'
        - '*\Windows\Tasks\SA.DAT'
  - id: azure-guest-agent
    label: benign
    why: Azure VM guest agent or one of its extensions doing routine management work as SYSTEM
    match:
      ancestor_image: ['C:\WindowsAzure\*', 'C:\Packages\Plugins\*', '*\CollectGuestLogs.exe', '*\WaAppAgent.exe', '*\WindowsAzureGuestAgent.exe']
  - id: scom-monitoring-agent
    label: benign
    why: System Center monitoring agent (MonitoringHost.exe) running its discovery script
    match:
      ancestor_image: '*\MonitoringHost.exe'
  - id: dsc-consistency-check
    label: benign
    why: >-
      WMI provider host running the Desired State Configuration consistency check as SYSTEM.
      It loads Microsoft DSC resource modules (including the Active Directory ones, which read
      the domain password policy), which is why PowerShell-host and discovery rules fire
    match:
      image: '*\wmiprvse.exe'
      user: 'NT AUTHORITY\SYSTEM'
      rules_all:
        - 'Alternate PowerShell Hosts*'
        - 'PSScriptPolicyTest Creation By Uncommon Process'
        - 'PowerShell Core DLL Loaded By Non PowerShell Process'
        - 'Powershell Token Obfuscation*'
        - 'Suspicious WSMAN Provider Image Loads'
        - 'Password Policy Discovery With Get-AdDefaultDomainPasswordPolicy'
        - 'Uncommon Connection to Active Directory Web Services'
        - 'System Drawing DLL Load'
  - id: boot-lsass-handles
    label: benign
    why: csrss.exe and wininit.exe open lsass.exe with full access when Windows starts
    match:
      image: ['*\csrss.exe', '*\wininit.exe']
      rules_all: ['Potential Credential Dumping Activity Via LSASS']
  - id: kernel-raw-disk
    label: benign
    why: The System process reading the disk directly, normal kernel behaviour
    match:
      image: ['System', '*unknown process*']
      rules_all: ['Potential Defense Evasion Via Raw Disk Access*']
  - id: sysmon-shred-noise
    label: benign
    why: Windows components rewriting their own log and cache files, which this lab's Sysmon configuration reports as blocked shredding
    match:
      image: ['*\taskhostw.exe', '*\svchost.exe']
      rules_all: ['Sysmon Blocked File Shredding']
  - id: bits-service
    label: benign
    why: Background Intelligent Transfer Service loading its own proxy DLL; no attacker step in this capture uses BITS
    match:
      image: '*\svchost.exe'
      rules_all: ['BITS Client BitsProxy DLL Loaded By Uncommon Process']
  - id: desktop-software
    label: benign
    why: Ordinary desktop software started in the user's logon session (wallpaper tool, Teams, OneDrive, Edge, Windows shell components)
    match:
      image:
        - 'C:\ProgramData\bginfo.exe'
        - '*\Microsoft\Teams\*'
        - '*\OneDriveStandaloneUpdater.exe'
        - '*\DeviceCensus.exe'
        - '*\RuntimeBroker.exe'
        - '*\SearchUI.exe'
        - '*\MicrosoftEdge.exe'
  - id: defender
    label: benign
    why: Microsoft Defender's own service writing its configuration
    match:
      image: '*\MsMpEng.exe'
  - id: remotefx-component
    label: benign
    why: Windows RemoteFX component run by Task Scheduler at start-up; it hosts PowerShell to query WMI
    match:
      image: 'C:\Windows\System32\RemoteFXvGPUDisablement.exe'
  - id: payload-mark-of-the-web-removed
    label: malicious
    why: >-
      Explorer removing the downloaded-from-the-internet marker from the attacker's payload.exe
      as the user launched it. The file named in the event is the attacker's payload
    match:
      image: '*\explorer.exe'
      rules_all: ['ADS Zone.Identifier Deleted']
      triggers_all: ['*\Downloads\payload.exe:Zone.Identifier']
  - id: new-process-handle
    label: side_effect
    why: >-
      csrss.exe opens a full-access handle to every new process. The new process here was
      started by the attack, but the handle itself is ordinary Windows behaviour
    match:
      image: '*\csrss.exe'
      rules_all: ['Uncommon Process Access Rights For Target Image']

